# Runs the API, the MVC website and Azurite (local blob storage) together: docker compose up --build
# Website: http://localhost:8080   API: http://localhost:5104/swagger

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck --loose
    ports:
      - "10000:10000"

  api:
    build:
      context: .
      dockerfile: src/RaceDay.Api/Dockerfile
    environment:
      Database__Provider: InMemory
      # Azurite's standard development account. Set AZURE_STORAGE_CONNECTION_STRING to use a real Azure account.
      BlobStorage__ConnectionString: ${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}
    ports:
      - "5104:8080"
    depends_on:
      - azurite

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      RaceDayApi__BaseUrl: http://api:8080/
    ports:
      - "8080:8080"
    depends_on:
      - api
