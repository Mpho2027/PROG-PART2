name: RaceDay CI

on:
  push:
    branches: [ "main", "part3-mvc" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Start Azurite for the blob storage tests
        run: docker run -d -p 10000:10000 mcr.microsoft.com/azure-storage/azurite:3.33.0 azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck

      - name: Restore
        run: dotnet restore RaceDay.sln

      - name: Build API, MVC and tests
        run: dotnet build RaceDay.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test RaceDay.sln --configuration Release --no-build
        env:
          RACEDAY_TEST_BLOB_CONNECTION: UseDevelopmentStorage=true

      - name: Build MVC Docker image
        run: docker build -t raceday-web .
